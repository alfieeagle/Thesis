import "nanopb.proto";

message SystemStatus
{
    optional float depth = 1;
    optional float ref_depth = 2;
    optional bool status = 3;
    optional float piston_pos = 4;
    optional float control_volume = 5;
    optional string message = 6 [(nanopb).max_size = 500];
}

message Command
{
  optional float target_depth = 1;
  optional float piston_vol = 2;
  optional bool manual = 3;
  optional bool enable = 4;
}