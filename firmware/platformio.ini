; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = 
	-std=c++20
	-DTEENSY_CORE
lib_extra_dirs = lib
lib_deps = 
	controller
	vbs
	git-jamie-s/Debounce @ ^1.0.0
	bluerobotics/BlueRobotics MS5837 Library@^1.1.1
	janelia-arduino/TMC2209@^10.1.1

[env:native]
platform = native
test_framework = unity
build_flags = 
	-std=c++20
	-Wconversion
	-Wfloat-conversion
	-Werror=conversion
	-Wno-error=sign-conversion
	-Wno-reorder
	-D UNITY_INCLUDE_DOUBLE
	-I include
lib_deps = 
	teemuatlut/TMCStepper@^0.7.3
	git-jamie-s/Debounce @ ^1.0.0
	bluerobotics/BlueRobotics MS5837 Library@^1.1.1
	janelia-arduino/TMC2209@^10.1.1

[env:teensy4]
platform = teensy
board = teensy40
framework = arduino
build_flags = 
	-std=c++20
	-DTEENSY_CORE
	-Wno-reorder
	-I include
lib_extra_dirs = lib
lib_deps = 
	controller
	vbs
	git-jamie-s/Debounce @ ^1.0.0
	bluerobotics/BlueRobotics MS5837 Library@^1.1.1
	janelia-arduino/TMC2209@^10.1.1

[env:arduino]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
	teemuatlut/TMCStepper@^0.7.3
	mathertel/OneButton@^2.6.2
	bluerobotics/BlueRobotics MS5837 Library@^1.1.1
	janelia-arduino/TMC2209@^10.1.1

[platformio]
default_envs = native
description = Code to run the VBS
