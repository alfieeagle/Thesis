; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:native]
platform = native
test_framework = unity
build_flags = 
	-std=c++20
	-Wconversion
	-Wfloat-conversion
	-Werror=conversion
	-Wno-error=sign-conversion
	-Wno-reorder
	-D UNITY_INCLUDE_DOUBLE
	-I include
lib_deps = 
	controller
	vbs
	git-jamie-s/Debounce @ ^1.0.0
	bluerobotics/BlueRobotics MS5837 Library@^1.1.1
	waspinator/AccelStepper@^1.64

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = 
	-std=c++20
	-DTEENSY_CORE
	-I include
lib_extra_dirs = lib
lib_deps = 
	controller
	vbs
	git-jamie-s/Debounce @ ^1.0.0
	bluerobotics/BlueRobotics MS5837 Library@^1.1.1
	waspinator/AccelStepper@^1.64
build_src_filter = +<dev/> 

[env:teensy4]
platform = teensy
board = teensy40
framework = arduino
build_flags = 
	-std=c++20
	-DTEENSY_CORE
	-Wno-reorder
	-I include
	-I messages
	-D TEENSY40
lib_extra_dirs = lib
lib_deps = 
	controller
	vbs
	nanopb
	git-jamie-s/Debounce @ ^1.0.0
	bluerobotics/BlueRobotics MS5837 Library@^1.1.1
	waspinator/AccelStepper@^1.64
build_src_filter = +<production/> 

[platformio]
default_envs = native
description = Code to run the VBS
